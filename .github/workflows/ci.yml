name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc,              cc: gcc,   cxx: g++,     build_type: Release, sanitize: OFF }
          - { name: clang,            cc: clang, cxx: clang++, build_type: Release, sanitize: OFF }
          - { name: gcc-asan-ubsan,   cc: gcc,   cxx: g++,     build_type: Debug,   sanitize: ON  }
          - { name: clang-asan-ubsan, cc: clang, cxx: clang++, build_type: Debug,   sanitize: ON  }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Kernels with high-entropy ASLR break older ASan runtimes ("DEADLYSIGNAL" loops).
      - name: Lower ASLR entropy for ASan
        if: matrix.sanitize == 'ON'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCODESCOPE_SANITIZE=${{ matrix.sanitize }}
          -DCODESCOPE_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: CLI smoke test
        if: matrix.sanitize == 'OFF'
        run: |
          ./build/codescope --version
          ./build/codescope search tests/fixtures/sample_repo HttpRequest --ext .hpp

  windows:
    name: msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  docker:
    name: docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t codescope:ci .

      - name: Serve a repository and query the API
        run: |
          docker run -d --name cs -p 8080:8080 -v "$PWD:/repo:ro" codescope:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          curl -fsS "http://localhost:8080/api/search?q=TrigramIndex&limit=5" | tee search.json
          grep -q '"total_files":' search.json
          curl -fsS http://localhost:8080/ | grep -q '<title>CodeScope</title>'

      - name: Container logs
        if: always()
        run: docker logs cs || true
